<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TensorRGBA - CIFAR-10 Generator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      background: #0f0f0f;
      color: #e0e0e0;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    p { color: #aaa; margin-top: 0; }
    .controls { display: flex; gap: 12px; align-items: center; margin: 24px 0; flex-wrap: wrap; }
    select, button, input[type="file"] {
      background: #222;
      color: #eee;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    button { cursor: pointer; background: #3b82f6; border-color: #3b82f6; }
    button:hover { background: #2563eb; }
    canvas {
      image-rendering: pixelated;
      width: 256px;
      height: 256px;
      border: 2px solid #333;
      background: #000;
      border-radius: 4px;
    }
    .status { margin-top: 12px; font-size: 13px; color: #888; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <h1>TensorRGBA CIFAR-10</h1>
  <p id="modelDescription">Load a PNG to see the model type</p>

  <div class="controls">
    <input type="file" id="modelFile" accept="image/png">
    <select id="classSelect">
      <option value="0">Airplane</option>
      <option value="1">Ship</option>
    </select>
    <button id="generateBtn" disabled>Generate</button>
  </div>

  <canvas id="output" width="32" height="32"></canvas>
  <div class="status" id="status">Load a model PNG to start</div>

  <script src="png_decoder.js"></script>
  <script src="load_model.js"></script>
  <script src="inference.js"></script>
  <script>
    let generator = null;
    let noiseDim = 128;
    let numClasses = 10;

    const statusEl = document.getElementById("status");
    const generateBtn = document.getElementById("generateBtn");
    const canvas = document.getElementById("output");
    const classSelect = document.getElementById("classSelect");
    const cifarClassNames = [
      "Airplane", "Automobile", "Bird", "Cat", "Deer",
      "Dog", "Frog", "Horse", "Ship", "Truck",
    ];

    document.getElementById("modelFile").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      statusEl.textContent = "Loading model...";
      statusEl.classList.remove("error");
      try {
        const { header, weights } = await loadModelFromPNG(file);
        noiseDim = header.noiseDim;
        numClasses = header.numClasses || 10;
        let modelClassNames;
        if (header.architectureId === 1) {
          modelClassNames = ["Airplane", "Ship"];
        } else if (numClasses === 2) {
          modelClassNames = ["Cat", "Dog"];
        } else {
          modelClassNames = cifarClassNames.slice(0, numClasses);
        }
        classSelect.replaceChildren();
        for (let index = 0; index < modelClassNames.length; index++) {
          const option = document.createElement("option");
          option.value = index;
          option.textContent = modelClassNames[index];
          classSelect.appendChild(option);
        }
        generator = createGenerator(
          weights,
          noiseDim,
          numClasses,
          header.architectureId,
        );
        generateBtn.disabled = false;
        const modeName = header.mode === 0 ? "float32" : "int8";
        const architectureName = header.architectureId === 1
          ? "conditional GAN"
          : "legacy MLP";
        const outputType = header.architectureId === 1
          ? "RGB"
          : "grayscale";
        document.getElementById("modelDescription").textContent =
          `${architectureName} · ${outputType}`;
        statusEl.textContent = `Model loaded (${modeName}) · ${header.totalParams.toLocaleString()} values`;
      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.classList.add("error");
        generateBtn.disabled = true;
        generator = null;
      }
    });

    generateBtn.addEventListener("click", () => {
      if (!generator) return;
      const label = parseInt(classSelect.value, 10);
      const noise = new Float32Array(noiseDim);
      for (let i = 0; i < noiseDim; i++) {
        noise[i] = Math.random() * 2 - 1;
      }
      const pixels = generateCifarImage(generator, label, noise);
      drawCifarImage(canvas, pixels);
    });
  </script>
</body>
</html>
